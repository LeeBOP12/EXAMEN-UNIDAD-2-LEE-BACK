spring:
  datasource:
    url: jdbc:oracle:thin:@//localhost:1522/FREEPDB1
    username: ${AGRO_DB_USERNAME:PHARMADB}
    password: ${AGRO_DB_PASSWORD:1234567}
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/agro-migration
    table: flyway_schema_history_agro
    baseline-on-migrate: true
    baseline-version: 0
